context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.name = "game_footstep_sink"
            node.description = "Game Sink (Footstep Boost)"
            media.class = "Audio/Sink"
            audio.position = [ FL FR ]
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = footstep_eq
                        plugin = bq_peaking
                        label  = bq_peaking
                        control = { "Freq" = 3000.0 "Q" = 2.0 "Gain" = 5.0 }
                    }
                ]
            }
            capture.props = {
                node.name = "effect_input.game_footstep"
                audio.rate = 48000
            }
            playback.props = {
                node.name = "effect_output.game_footstep"
                audio.rate = 48000
            }
        }
    }
]
