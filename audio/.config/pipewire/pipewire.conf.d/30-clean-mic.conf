context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.name = "mic_clean_source"
            node.description = "Clean Mic (HPF + RNNoise)"
            media.class = "Audio/Source"
            audio.position = [ MONO ]
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = hpf_cut
                        label   = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.707 }
                    },
                    {
                        type    = ladspa
                        name    = rnnoise
                        plugin  = librnnoise_ladspa
                        label   = rnnoise_mono
                        control = { "VAD Threshold (%)" = 50.0 }
                    }
                ]
                links = [
                    { output = "hpf_cut:Out" input = "rnnoise:In" }
                ]
                inputs  = [ "hpf_cut:In" ]
                outputs = [ "rnnoise:Out" ]
            }
            capture.props = {
                node.name = "effect_input.mic_clean"
                audio.rate = 48000
            }
            playback.props = {
                node.name = "effect_output.mic_clean"
                audio.rate = 48000
            }
        }
    }
]
