backend = "xrender";
vsync = true;

# Transparency (adjust 0.0 to 1.0 to taste)
inactive-opacity = 0.65;
active-opacity = 0.75;
frame-opacity = 0.90;

# Dim/make transparent while dragging or resizing
opacity-rule = [
  "65:window_type = 'normal' && _NET_WM_STATE *= '_NET_WM_STATE_MOVING'",
  "65:window_type = 'normal' && _NET_WM_STATE *= '_NET_WM_STATE_RESIZING'"
];

# Glass blur effect
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS"
];

# Smooth fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
